[package]
name = "memo-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web ={ version = "4", features = ["rustls-0_23"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
actix-governor = "0.10.0"
actix-cors = "0.7.2"
argon2 = { version = "0.5", features = ["password-hash", "std"] }
password-hash = { version = "0.5", features = ["rand_core", "getrandom"] }
jsonwebtoken = "9"
rustls = "0.23"
rustls-pemfile = "2"
